[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aqi-india"
version = "0.1.0"
description = "Surface AQI mapping and HCHO hotspot detection over India from satellite data (BAH 2026 ISRO PS3)."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BAH 2026 PS3 Team" }]
keywords = ["air-quality", "aqi", "remote-sensing", "hcho", "india", "isro", "tropomi", "insat"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
]

# LIGHT dependency set — the runnable demo must work with only these.
# Heavy/credentialed deps (torch, earthengine, cdsapi, ...) live in optional groups
# and are lazy-imported inside functions, never at module import time.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "lightgbm>=4.1",
    "h3>=4.1",
    "matplotlib>=3.8",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rioxarray>=0.15",
    "xarray>=2023.12",
    "netCDF4>=1.6",
    "esda>=2.5",
    "libpysal>=4.9",
    "splot>=1.1.5",
    "pymannkendall>=1.4",
    "statsmodels>=0.14",
    "folium>=0.15",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.7",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# Deep-learning core (Objective-1 SA-ConvLSTM / CNN-LSTM / GNN / U-Net inpaint).
deep = [
    "torch>=2.1",
    "torch-geometric>=2.4",
    "segmentation-models-pytorch>=0.3",
]
# Cloud ingestion / Earth observation access.
gee = [
    "earthengine-api>=0.1.380",
    "geemap>=0.30",
    "cdsapi>=0.6",
    "earthaccess>=0.9",
    "pystac-client>=0.7",
    "odc-stac>=0.3",
]
# Tiling / interactive serving.
serve = [
    "titiler.core>=0.18",
    "titiler.mosaic>=0.18",
    "lonboard>=0.9",
    "pydeck>=0.8",
    "streamlit>=1.30",
]
# Geostatistics / gap-fill / regridding.
geo = [
    "pykrige>=1.7",
    "gstools>=1.5",
    "scikit-gstat>=1.0",
    "xesmf>=0.8",
    "hdbscan>=0.8.33",
]
# Lagrangian transport.
transport = [
    "pysplit>=0.3.5",
]
# Developer tooling.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
aqi = "aqi_india.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aqi_india"]

[tool.hatch.build.targets.wheel.force-include]
"src/aqi_india/data" = "aqi_india/data"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
