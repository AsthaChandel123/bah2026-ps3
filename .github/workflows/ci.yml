name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "claude/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libraries
        # lightgbm needs libgomp at runtime; the geospatial wheels (shapely,
        # rasterio, pyproj, ...) ship manylinux binaries that bundle GEOS/GDAL,
        # so no extra system libs are required for them.
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
