# @package datasets.era5
# ERA5 single-level reanalysis meteorology (CDS for BLH/upper winds; GEE for 2D).
name: era5
provider: ECMWF / Copernicus CDS
access: cdsapi
cds_dataset: reanalysis-era5-single-levels
gee_collection: ECMWF/ERA5_LAND/HOURLY
variables:
  - boundary_layer_height          # NOTE: NOT in GEE ERA5 — must use CDS
  - "10m_u_component_of_wind"
  - "10m_v_component_of_wind"
  - "2m_temperature"
  - "2m_dewpoint_temperature"
  - surface_solar_radiation_downwards
  - mean_sea_level_pressure
  - total_precipitation
resolution_deg: 0.25
cadence: hourly
caveat: GEE ERA5 lacks boundary_layer_height and pressure-level winds — pull BLH from CDS.
