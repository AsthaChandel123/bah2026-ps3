# @package model
name: saconvlstm
description: Physics-guided SA-ConvLSTM (ConvLSTM + temporal self-attention + channel attention).
type: deep
requires_extra: deep
target: [pm25, pm10, no2, so2, co, o3]
in_channels: 20            # satellite columns + physics + met + static + temporal
hidden_dims: [64, 64, 64]
kernel_size: 3
n_layers: 3
seq_len: 7                 # T days of history
patch: 128                 # HxW tile
attention: {temporal: true, channel: true}
pretrain: {source: merra2, target: pm25}   # pretrain on gap-free reanalysis, fine-tune on CPCB
loss: masked_charbonnier
optimizer: {name: adamw, lr: 0.0003, weight_decay: 0.0001}
epochs: 60
batch_size: 8
seed: 42
