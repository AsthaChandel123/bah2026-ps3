# @package model
name: lightgbm
description: LightGBM gradient-boosting tabular baseline / stacking member.
type: tabular
requires_extra: null
target: pm25
objective: regression
n_estimators: 1200
learning_rate: 0.03
num_leaves: 63
max_depth: -1
subsample: 0.8
colsample_bytree: 0.8
min_child_samples: 40
monotonic_constraints: {aod: 1}   # AOD monotonic up
quantiles: [0.1, 0.5, 0.9]        # quantile heads for UQ
seed: 42
